<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
    <h1>HTML & CSS Quiz</h1>
    <form >

        <label for="q1">1. What does "HTML" stand for?</label>
        <input type="text" id="q1" name="q1" required>
        <br><br>

        
        <label for="q2">2. Briefly explain what CSS is used for.</label>
        <textarea id="q2" name="q2" rows="3" required></textarea>
        <br><br>

     
        <label for="q3">3. Which CSS property is used to change the background color?</label>
        <select id="q3" name="q3" required>
            <option value="" selected disabled>Choose one answer</option>
            <option value="color">color</option>
            <option value="background-color">background-color</option>
            <option value="bgcolor">bgcolor</option>
            <option value="background">background</option>
        </select>
        <br><br>

        
        <label for="q4">4. How many heading levels (h1 to h6) are there in HTML? (Enter a number)</label>
        <input type="number" id="q4" name="q4" min="1" max="10" required>
        <br><br>

        <button type="submit">Submit Quiz</button>
    </form>
</body>
</html>
